name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/xu-cheng/texlive-full:latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile LaTeX
        run: |
          find . -path '*/build/*' -prune -o -name "*.tex" -print | while read -r f; do
            latexmk -pdfdvi -latex=uplatex -e '$dvipdf = "dvipdfmx %O -o %D %S"' -interaction=nonstopmode -cd "$f"
          done

      - name: Move latest tag to current commit
        run: |
          git tag -f latest
          git push origin refs/tags/latest --force

      - name: Create or update release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: Latest Build
          files: "**/*.pdf"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
